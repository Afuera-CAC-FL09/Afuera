# ---------------------------------------------------------------------------
# "What are you running?" profiles (POST /profile). These send `text` and `role`
# instead of a question. Checks: baseTemplate, gear, surface, shade, effort, role
# (a value or a list of allowed values), group_size [min, max], name_matches (regex
# on displayName), never (regex on the whole profile). Every profile is also
# checked for "safe"/"seguro", a displayName over 40 characters, and more than 3
# extra check-ins.

- id: profile-band-parking-es
  endpoint: profile
  language: es
  role: organizer
  text: ensayo de banda con uniformes en el estacionamiento
